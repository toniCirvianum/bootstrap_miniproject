<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercici 1 - Perfil d'usuari</title>
  <!-- Carreguem Bootstrap des del CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- container centra el contingut i mt-5 afegeix marge superior -->
  <div class="container mt-5">
    <!-- row crea una fila; align-items-center centra verticalment les columnes -->
    <div class="row align-items-center">
      <!--
        col-12: en pantalles petites ocupa les 12 columnes, és a dir, tot l'ample.
        col-md-4: a partir de 768 px ocupa 4 de les 12 columnes.
        text-center: centra el contingut.
      -->
      <div class="col-12 col-md-4 text-center">
        <!-- img-fluid fa la imatge responsive; rounded-circle la fa circular -->
        <img src="assets/profile.svg" class="img-fluid rounded-circle" alt="Foto de perfil">
        <!-- mt-3 afegeix marge superior -->
        <h2 class="mt-3">John Smith</h2>
      </div>

      <!--
        col-12: en pantalles petites ocupa tot l'ample.
        col-md-8: a partir de 768 px ocupa 8 de les 12 columnes.
      -->
      <div class="col-12 col-md-8">
        <h3 class="mb-4">Informació de l'usuari</h3>
        <p><strong>Email:</strong> user@email.com</p>
        <p><strong>Ciutat:</strong> Barcelona</p>
        <!-- btn i btn-primary creen un botó amb estil Bootstrap -->
        <button class="btn btn-primary">Editar perfil</button>
      </div>
    </div>

    <a href="index.html" class="btn btn-secondary mt-4">Tornar</a>
  </div>
</body>
</html>
